
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="game-container">
        <h1> Guess the Number</h1>
        <p>Choose a number and try to guess the secret number!</p>

        <form id="settingsForm">
            <div class="settings">
                <label for="minNumber">Minimum:</label>
                <input type="number" id="minNumber" value="1" required>

                <label for="maxNumber">Maximum:</label>
                <input type="number" id="maxNumber" value="100" required>
            </div>

            <button type="submit" id="startButton">Start New Game</button>
        </form>

        <div id="gameArea" hidden>
            <p id="rangeText"></p>

            <form id="guessForm">
                <label for="guessInput">Your guess:</label>

                <input
                    type="number"
                    id="guessInput"
                    placeholder="Enter a number"
                    required
                >

                <button type="submit">Guess!</button>
            </form>

            <p id="message">Good luck!</p>
            <p id="attempts">Attempts: 0</p>

            <button type="button" id="restartButton">
                Play Again
            </button>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
